<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>一维码扫描器</title>

<style>
body{
  margin:0;
  background:#f5f5f7;
  color:#111827;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
main{
  max-width:720px;
  margin:auto;
  padding:18px 14px 40px
}
h1{font-size:26px;margin:5px 0}
.sub{color:#6b7280}

.card{
  background:#fff;
  border-radius:18px;
  padding:15px;
  margin:12px 0;
  box-shadow:0 2px 12px #0001
}

#reader{
  width:100%;
  min-height:300px;
  background:#111;
  border-radius:14px;
  overflow:hidden
}

button{
  min-height:46px;
  border:0;
  border-radius:12px;
  padding:11px 16px;
  font-size:16px;
  font-weight:600;
  background:#111827;
  color:#fff;
  margin:5px 4px 5px 0
}

.secondary{
  background:#e5e7eb;
  color:#111827
}

.danger{
  background:#fee2e2;
  color:#991b1b
}

.stats{
  display:flex;
  gap:8px
}

.stat{
  flex:1;
  background:#f3f4f6;
  border-radius:13px;
  padding:11px
}

.num{
  font-size:27px;
  font-weight:800
}

.label{
  font-size:12px;
  color:#6b7280
}

.status{
  padding:12px;
  border-radius:12px;
  background:#f3f4f6;
  margin-top:9px;
  font-weight:600;
  word-break:break-word
}

.ok{
  background:#dcfce7;
  color:#166534
}

.dup{
  background:#fef3c7;
  color:#92400e
}

.err{
  background:#fee2e2;
  color:#991b1b
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px
}

th,td{
  text-align:left;
  padding:9px 5px;
  border-bottom:1px solid #eee;
  vertical-align:top
}

th{
  color:#6b7280
}

.code{
  word-break:break-all
}

.small{
  font-size:12px;
  color:#6b7280;
  line-height:1.5
}
</style>
</head>

<body>

<main>

<h1>一维码扫描器</h1>
<p class="sub">条形码内容作为唯一 ID · 自动连续扫描</p>

<div class="card">

<div id="reader"></div>

<div id="status" class="status">
点击“开始扫描”，然后允许使用摄像头。
</div>

<button id="start">开始扫描</button>
<button id="stop" class="secondary">停止扫描</button>

</div>


<div class="card">

<div class="stats">

<div class="stat">
<div class="num" id="count">0</div>
<div class="label">唯一一维码数量</div>
</div>

<div class="stat">
<div class="num" id="duplicates">0</div>
<div class="label">重复扫描次数</div>
</div>

</div>

<button id="export">导出 CSV</button>
<button id="clear" class="danger">清空记录</button>

</div>


<div class="card">

<h3 style="margin:0 0 10px">扫描记录</h3>

<div style="overflow:auto">

<table>

<thead>

<tr>
<th>#</th>
<th>条形码内容</th>
<th>首次扫描</th>
<th>最近扫描</th>
<th>重复</th>
</tr>

</thead>

<tbody id="rows"></tbody>

</table>

</div>

<p class="small">
记录保存在当前 iPhone 浏览器本地。清除 Safari 网站数据可能导致记录丢失。
</p>

</div>

</main>


<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>


<script>

(()=>{

const KEY="barcode_scanner_v3";

let records=
JSON.parse(localStorage.getItem(KEY)||"[]");

let dups=
+localStorage.getItem(KEY+"_d")||0;

let scanner=null;

let running=false;

let locked=false;

let last="";

let lastTime=0;


const $=x=>document.getElementById(x);


function save(){

localStorage.setItem(
KEY,
JSON.stringify(records)
);

localStorage.setItem(
KEY+"_d",
dups
);

}


function esc(s){

return String(s).replace(
/[&<>"']/g,
c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c])
);

}


function render(){

$("count").textContent=records.length;

$("duplicates").textContent=dups;

$("rows").innerHTML=

records
.slice()
.reverse()
.map((r,i)=>`

<tr>

<td>${records.length-i}</td>

<td class="code">
${esc(r.id)}
</td>

<td>
${esc(r.first)}
</td>

<td>
${esc(r.last)}
</td>

<td>
${r.duplicates}
</td>

</tr>

`)
.join("");

}


function speak(t){

if("speechSynthesis" in window){

speechSynthesis.cancel();

let u=
new SpeechSynthesisUtterance(t);

u.lang="zh-CN";

speechSynthesis.speak(u);

}

}


const now=()=>new Date()
.toLocaleString(
"zh-CN",
{hour12:false}
);


function status(t,c=""){

$("status").className=
"status "+c;

$("status").textContent=t;

}


function onScan(decoded){

let id=
String(decoded||"").trim();

if(!id||locked)return;


/* 防止同一个条形码在摄像头里连续触发 */

if(
id===last &&
Date.now()-lastTime<1600
)return;


last=id;

lastTime=Date.now();

locked=true;


let t=now();

let r=
records.find(x=>x.id===id);


if(r){

/* 重复扫描 */

r.last=t;

r.duplicates++;

dups++;

save();

render();

status(
"⚠️ 重复扫描："+id,
"dup"
);

speak("重复扫描");

}else{

/* 第一次扫描 */

records.push({

id:id,

first:t,

last:t,

duplicates:0

});

save();

render();

status(
"✅ 扫描成功："+id,
"ok"
);

speak("扫描成功");

}


/* 稍微锁定一下，避免一次扫描触发多次 */

setTimeout(
()=>locked=false,
850
);

}


async function start(){

if(running)return;


if(typeof Html5Qrcode==="undefined"){

status(
"扫码组件加载失败，请检查网络。",
"err"
);

return;

}


scanner=
new Html5Qrcode("reader");


try{

await scanner.start(

{facingMode:"environment"},

{

fps:12,

qrbox:{
width:320,
height:160
},

formatsToSupport:[

Html5QrcodeSupportedFormats.EAN_13,

Html5QrcodeSupportedFormats.EAN_8,

Html5QrcodeSupportedFormats.UPC_A,

Html5QrcodeSupportedFormats.UPC_E,

Html5QrcodeSupportedFormats.CODE_128,

Html5QrcodeSupportedFormats.CODE_39,

Html5QrcodeSupportedFormats.ITF,

Html5QrcodeSupportedFormats.CODABAR

]

},

onScan,

()=>{}

);


running=true;

status(
"📷 正在连续扫描一维码……"
);


}catch(e){

status(
"无法打开后置摄像头，请确认 Safari 摄像头权限和 HTTPS。",
"err"
);

try{

await scanner.clear();

}catch(_){}

scanner=null;

}

}


async function stop(){

if(!scanner||!running)return;

try{

await scanner.stop();

await scanner.clear();

}catch(_){}

running=false;

status("已停止扫描。");

}


function csv(){

let h=[
"序号",
"一维码内容",
"首次扫描",
"最近扫描",
"重复扫描次数"
];


let a=[
h,
...records.map(
(r,i)=>[
i+1,
r.id,
r.first,
r.last,
r.duplicates
]
)
];


let s=
a.map(
row=>row.map(
v=>`"${String(v).replace(/"/g,'""')}"`
).join(",")
).join("\r\n");


let b=new Blob(
["\ufeff"+s],
{
type:"text/csv;charset=utf-8"
}
);


let x=document.createElement("a");

x.href=
URL.createObjectURL(b);

x.download=
"一维码扫描记录.csv";

x.click();

setTimeout(
()=>URL.revokeObjectURL(x.href),
1000
);

}


$("start").onclick=start;

$("stop").onclick=stop;

$("export").onclick=csv;


$("clear").onclick=()=>{

if(
confirm("确定清空全部记录吗？")
){

records=[];

dups=0;

save();

render();

status("记录已清空。");

}

};


render();

})();

</script>

</body>
</html>
